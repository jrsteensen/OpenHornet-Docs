name: Build and Deploy Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: openhornet-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs deployment repo
        uses: actions/checkout@v4

      - name: Checkout software source
        uses: actions/checkout@v4
        with:
          repository: jrsteensen/OpenHornet-Software
          ref: ${{ github.event.client_payload.software_ref || 'main' }}
          path: sources/software
          sparse-checkout: |
            README.md
            docs
            embedded
          sparse-checkout-cone-mode: false

      - name: Checkout hardware source
        uses: actions/checkout@v4
        with:
          repository: jrsteensen/OpenHornet
          ref: ${{ github.event.client_payload.hardware_ref || 'master' }}
          path: sources/hardware
          sparse-checkout: |
            README.md
            docs
            images
          sparse-checkout-cone-mode: false

      - name: Install Doxygen tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen rsync

      - name: Build documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-docs.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhornet-docs
          path: public

      - name: Check Cloudflare deploy secrets
        id: cloudflare-secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Cloudflare deploy secrets are incomplete; built docs artifact but skipped deploy."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=openhornet-docs
